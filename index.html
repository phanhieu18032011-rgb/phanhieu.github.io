            color: #f87171; /* red-400 */

            white-space: pre-wrap;
            word-break: break-all;

            border-radius: 0.5rem;

                font-size: 3rem; /* Tùy chỉnh kích thước font cho mobile */

            // --- Helper function for client downloads (Android/iOS) ---
            function createClientCard(icon, name, link, statusEmoji, statusText, version) {
                const card = document.createElement('div');
                // Tăng padding trên mobile (p-4) và bình thường (sm:p-6)
                card.className = 'bg-gray-800 p-4 sm:p-6 rounded-xl shadow-2xl transition duration-300 hover:scale-[1.02] hover:shadow-blue-500/50 flex flex-col justify-between';
                
                card.innerHTML = `
                    <div class="flex items-start mb-4">
                        <span class="text-3xl sm:text-4xl mr-3 sm:mr-4">${icon}</span>
                        <div>
                            <h3 class="text-xl sm:text-2xl font-semibold text-blue-300">${name}</h3>
                            <p class="text-xs sm:text-sm font-mono text-gray-500">${version}</p>
                        </div>
                    </div>
                    
                    <!-- Hiển thị trạng thái -->
                    <div class="flex items-center mb-4 sm:mb-6">
                        <span class="text-base sm:text-lg mr-2">${statusEmoji}</span>
                        <span class="text-gray-300 font-medium text-sm sm:text-base">${statusText}</span>
                    </div>
                    
                    <!-- Nút Tải Ngay -->
                    <a href="${link}" target="_blank" class="w-full text-center py-2 sm:py-3 px-4 sm:px-6 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition duration-200 shadow-lg shadow-blue-500/50 uppercase transform hover:-translate-y-1 text-sm sm:text-base">
                        Tải Ngay
                    </a>
                `;
                return card;
            }

            // --- Helper function for script cards ---
            function createScriptCard(name, keyStatus, features, code) {
                const card = document.createElement('div');
                card.className = 'bg-gray-800 p-4 sm:p-6 rounded-xl shadow-lg transition duration-300 hover:border-green-500/50 border border-gray-700 flex flex-col justify-between';
                
                let keyTag = '';
                if (keyStatus) {
                    const color = keyStatus.includes('NO KEY') ? 'bg-green-600' : (keyStatus.includes('Có KEY') ? 'bg-red-600' : 'bg-yellow-600');
                    keyTag = `<span class="text-xs font-bold px-2 py-1 rounded-full ${color} text-white">${keyStatus}</span>`;
                }

                card.innerHTML = `
                    <div class="mb-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg sm:text-xl font-bold text-green-300">${name}</h3>
                            ${keyTag}
                        </div>
                        <p class="text-xs sm:text-sm text-gray-400 mt-1">${features}</p>
                    </div>
                    
                    <!-- Code Block -->
                    <div class="relative mb-4">
                        <pre id="code-${name.replace(/\s/g, '-')}" class="script-code">${code.trim()}</pre>
                        <button onclick="copyScriptCode(this, 'code-${name.replace(/\s/g, '-')}')" class="absolute top-2 right-2 p-1 sm:p-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded transition duration-200">
                            Copy
                        </button>
                    </div>
                    <!-- Message Box (Thêm nền màu để hiển thị rõ hơn trên mobile) -->
                    <p id="message-${name.replace(/\s/g, '-')}" class="text-sm text-center bg-gray-700/50 py-1 rounded text-yellow-400 hidden">Đã sao chép!</p>
                `;
                return card;
            }
            
            // --- Copy Functionality ---
            function copyScriptCode(button, elementId) {
                const codeElement = document.getElementById(elementId);
                const messageElement = document.getElementById(`message-${elementId.substring(5)}`);
                const code = codeElement.textContent;

                // Copy to clipboard (using deprecated execCommand for broader compatibility in some environments)
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = code;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextArea);

                // Show success message and hide after 2 seconds
                button.textContent = 'Đã Copy!';
                button.disabled = true;
                messageElement.style.display = 'block';

                setTimeout(() => {
                    button.textContent = 'Copy';
                    button.disabled = false;
                    messageElement.style.display = 'hidden';
                }, 2000);
            }
            window.copyScriptCode = copyScriptCode; // Expose to global scope for onclick handler

                        client.link,

            if (scriptsContainer) {
