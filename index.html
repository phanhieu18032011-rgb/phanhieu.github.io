<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRGteam Mode - Downloads Chính Thức</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            /* Nền tối sâu */
            background-color: #0d1117;
        }

        /* Định nghĩa style cho nút Download với hiệu ứng gradient và shadow mạnh */
        .download-button {
            background-image: linear-gradient(to right, #3b82f6, #06b6d4); /* blue-500 đến cyan-500 */
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .download-button:hover {
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
            transform: translateY(-2px);
        }

        /* Custom styles cho khối code */
        .script-code {
            background-color: #1a202c; /* Tối hơn một chút cho code */
            color: #ff7f7f; /* Màu code đỏ nhạt */
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            max-height: 200px;
            font-size: 0.875rem;
            border: 1px solid #374151; /* gray-700 */
        }

        /* Hiệu ứng neon cho tiêu đề chính */
        .neon-text {
            text-shadow: 0 0 5px #3b82f6, 0 0 10px #3b82f6, 0 0 20px #2563eb;
        }
        
        /* Modal Backdrop */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Google button specific style */
        .google-btn {
            background-color: #4285f4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #3c7de0;
            transition: background-color 0.3s;
        }
        .google-btn:hover {
            background-color: #357ae8;
        }
        .google-icon-wrapper {
            background-color: white;
            padding: 8px;
            border-radius: 4px;
            margin-right: 12px;
        }
        .google-icon {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body class="text-white min-h-screen p-0">
    
    <!-- Thanh điều hướng (Header) với trạng thái Đăng nhập -->
    <nav class="sticky top-0 bg-gray-900/80 backdrop-blur-md shadow-lg z-50 p-4 border-b border-gray-700">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="text-xl font-bold text-blue-400">DRGteam <span class="text-white">Mode</span></div>
            <div id="auth-status" class="flex items-center space-x-3">
                <!-- Vị trí hiển thị trạng thái và nút Auth -->
            </div>
        </div>
    </nav>

    <header class="text-center py-10 bg-gray-900/40 rounded-b-xl mb-12 shadow-2xl">
        <h1 class="main-title text-4xl sm:text-6xl font-extrabold text-blue-400 tracking-tighter neon-text">
            DRGteam Mode
        </h1>
        <p class="text-base sm:text-xl mt-3 text-gray-300">Tải xuống Clients/Executors & Scripts Chính Thức cho Cộng đồng</p>
    </header>

    <main class="max-w-6xl mx-auto space-y-12 p-4 sm:p-0 sm:pb-8">
        
        <!-- Phần dành cho ANDROID -->
        <section>
            <h2 class="text-3xl sm:text-4xl font-bold mb-6 border-b-4 border-blue-500 pb-2 inline-block">ANDROID CLIENTS</h2>
            <div id="android-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </section>

        <!-- Phần dành cho IOS -->
        <section>
            <h2 class="text-3xl sm:text-4xl font-bold mb-6 border-b-4 border-blue-500 pb-2 inline-block">IOS CLIENTS</h2>
            <div id="ios-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <!-- Cards will be generated by JavaScript -->
            </div>
        </section>

        <!-- PHẦN SCRIPTS: BLOX FRUITS SCRIPTS -->
        <section>
            <details id="scripts-details" class="group rounded-xl shadow-2xl overflow-hidden border border-green-700/50">
                <summary class="flex items-center justify-between p-4 sm:p-6 cursor-pointer bg-green-900/30 hover:bg-green-900/50 transition duration-300">
                    <h2 class="text-xl sm:text-3xl font-bold text-green-400 flex items-center">
                        <span class="mr-3 text-2xl sm:text-3xl">👾</span> Blox Fruits Scripts (Executor Code)
                    </h2>
                    <svg class="w-6 h-6 transform transition-transform duration-300 group-open:rotate-180 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </summary>
                
                <div id="scripts-container" class="p-4 sm:p-6 bg-gray-900 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Script cards will be generated by JavaScript -->
                </div>
            </details>
        </section>

        <!-- Modal Đăng nhập -->
        <div id="login-modal" class="modal-backdrop">
            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-sm border border-gray-700">
                <h3 class="text-2xl font-bold mb-4 text-blue-300">Đăng Nhập</h3>
                
                <!-- Nút Đăng nhập bằng Google -->
                <button type="button" id="google-login-btn" class="google-btn w-full py-2 mb-4 rounded-lg font-semibold transition duration-200 shadow-md">
                    <div class="google-icon-wrapper">
                        <!-- Google SVG Icon -->
                        <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" enable-background="new 0 0 48 48">
                            <g>
                                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.618 3.167-4.919 5.333-9.303 5.333-6.76 0-12.26-5.498-12.26-12.26s5.498-12.26 12.26-12.26c3.187 0 6.098 1.29 8.243 3.42l5.79-5.79C37.4 2.82 31.83 0 24 0 10.745 0 0 10.745 0 24s10.745 24 24 24c11.082 0 20.353-8.026 22.189-18.514V28h-6v-3.917h-0.389z"/>
                                <path fill="#FF3D00" d="M6.306 14.693l6.571 4.975c-1.545 3.102-2.316 6.577-2.316 10.102 0 7.747 5.093 14.245 12.012 16.514C11.534 45.47 2.112 37.001 2.112 28C2.112 24.239 2.946 20.65 4.545 17.514l1.761-2.821z"/>
                                <path fill="#4CAF50" d="M43.611 20.083h-2.389v-0.083H24v8h11.303c-1.618 3.167-4.919 5.333-9.303 5.333-6.76 0-12.26-5.498-12.26-12.26s5.498-12.26 12.26-12.26c3.187 0 6.098 1.29 8.243 3.42l5.79-5.79C37.4 2.82 31.83 0 24 0 10.745 0 0 10.745 0 24s10.745 24 24 24c11.082 0 20.353-8.026 22.189-18.514V28h-6v-3.917h-0.389z"/>
                                <path fill="#1976D2" d="M6.306 14.693l6.571 4.975c-1.545 3.102-2.316 6.577-2.316 10.102 0 7.747 5.093 14.245 12.012 16.514C11.534 45.47 2.112 37.001 2.112 28C2.112 24.239 2.946 20.65 4.545 17.514l1.761-2.821z"/>
                            </g>
                        </svg>
                    </div>
                    Đăng nhập bằng Google
                </button>
                
                <div class="flex items-center justify-center mb-4">
                    <hr class="w-full border-gray-600">
                    <span class="px-3 text-gray-500 text-sm">hoặc</span>
                    <hr class="w-full border-gray-600">
                </div>

                <form id="login-form">
                    <div class="mb-4">
                        <label for="login-email" class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                        <input type="email" id="login-email" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500" required>
                    </div>
                    <div class="mb-6">
                        <label for="login-password" class="block text-sm font-medium text-gray-400 mb-1">Mật Khẩu</label>
                        <input type="password" id="login-password" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500" required>
                    </div>
                    <p id="login-error-message" class="text-red-400 text-sm mb-4 hidden"></p>
                    <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-semibold transition duration-200">Đăng Nhập bằng Email</button>
                    <button type="button" onclick="closeModal('login-modal')" class="w-full mt-3 py-2 bg-gray-600 hover:bg-gray-700 rounded-lg text-white font-semibold transition duration-200">Hủy</button>
                    <p class="text-center text-sm text-gray-400 mt-4">Chưa có tài khoản? 
                        <a href="#" onclick="showRegisterFromLogin()" class="text-cyan-400 hover:text-cyan-300 font-medium">Đăng Ký</a>
                    </p>
                </form>
            </div>
        </div>

        <!-- Modal Đăng ký -->
        <div id="register-modal" class="modal-backdrop">
            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-sm border border-gray-700">
                <h3 class="text-2xl font-bold mb-4 text-green-300">Đăng Ký Tài Khoản</h3>
                
                <!-- Nút Đăng nhập bằng Google (Cũng dùng cho đăng ký nhanh) -->
                <button type="button" id="google-register-btn" class="google-btn w-full py-2 mb-4 rounded-lg font-semibold transition duration-200 shadow-md">
                    <div class="google-icon-wrapper">
                        <!-- Google SVG Icon -->
                        <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" enable-background="new 0 0 48 48">
                            <g>
                                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.618 3.167-4.919 5.333-9.303 5.333-6.76 0-12.26-5.498-12.26-12.26s5.498-12.26 12.26-12.26c3.187 0 6.098 1.29 8.243 3.42l5.79-5.79C37.4 2.82 31.83 0 24 0 10.745 0 0 10.745 0 24s10.745 24 24 24c11.082 0 20.353-8.026 22.189-18.514V28h-6v-3.917h-0.389z"/>
                                <path fill="#FF3D00" d="M6.306 14.693l6.571 4.975c-1.545 3.102-2.316 6.577-2.316 10.102 0 7.747 5.093 14.245 12.012 16.514C11.534 45.47 2.112 37.001 2.112 28C2.112 24.239 2.946 20.65 4.545 17.514l1.761-2.821z"/>
                                <path fill="#4CAF50" d="M43.611 20.083h-2.389v-0.083H24v8h11.303c-1.618 3.167-4.919 5.333-9.303 5.333-6.76 0-12.26-5.498-12.26-12.26s5.498-12.26 12.26-12.26c3.187 0 6.098 1.29 8.243 3.42l5.79-5.79C37.4 2.82 31.83 0 24 0 10.745 0 0 10.745 0 24s10.745 24 24 24c11.082 0 20.353-8.026 22.189-18.514V28h-6v-3.917h-0.389z"/>
                                <path fill="#1976D2" d="M6.306 14.693l6.571 4.975c-1.545 3.102-2.316 6.577-2.316 10.102 0 7.747 5.093 14.245 12.012 16.514C11.534 45.47 2.112 37.001 2.112 28C2.112 24.239 2.946 20.65 4.545 17.514l1.761-2.821z"/>
                            </g>
                        </svg>
                    </div>
                    Đăng ký bằng Google
                </button>

                <div class="flex items-center justify-center mb-4">
                    <hr class="w-full border-gray-600">
                    <span class="px-3 text-gray-500 text-sm">hoặc</span>
                    <hr class="w-full border-gray-600">
                </div>

                <form id="register-form">
                    <div class="mb-4">
                        <label for="register-email" class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                        <input type="email" id="register-email" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-white focus:ring-green-500 focus:border-green-500" required>
                    </div>
                    <div class="mb-4">
                        <label for="register-password" class="block text-sm font-medium text-gray-400 mb-1">Mật Khẩu (Tối thiểu 6 ký tự)</label>
                        <input type="password" id="register-password" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-white focus:ring-green-500 focus:border-green-500" required>
                    </div>
                    <p id="register-error-message" class="text-red-400 text-sm mb-4 hidden"></p>
                    <button type="submit" class="w-full py-2 bg-green-600 hover:bg-green-700 rounded-lg text-white font-semibold transition duration-200">Đăng Ký bằng Email</button>
                    <button type="button" onclick="closeModal('register-modal')" class="w-full mt-3 py-2 bg-gray-600 hover:bg-gray-700 rounded-lg text-white font-semibold transition duration-200">Hủy</button>
                </form>
            </div>
        </div>

        <!-- Message Modal (Global) -->
        <div id="message-modal" class="modal-backdrop">
            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-xs border border-gray-700 text-center">
                <p id="message-text" class="text-white text-lg mb-4"></p>
                <button onclick="closeModal('message-modal')" class="w-full py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-semibold">Đóng</button>
            </div>
        </div>


        <!-- SCRIPT CHUNG ĐỂ TẠO CÁC CARD VÀ XỬ LÝ AUTH -->
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
            import { 
                getAuth, 
                signInAnonymously, 
                signInWithCustomToken, 
                onAuthStateChanged, 
                createUserWithEmailAndPassword, 
                signInWithEmailAndPassword, 
                signOut,
                GoogleAuthProvider, // Thêm GoogleAuthProvider
                signInWithPopup     // Thêm signInWithPopup
            } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
            import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
            import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
            
            // --- FIREBASE SETUP AND AUTHENTICATION ---
            let auth, db;
            const googleProvider = new GoogleAuthProvider(); // Khởi tạo Google Provider

            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            if (Object.keys(firebaseConfig).length > 0) {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Set debug level for firestore
                setLogLevel('Debug'); 
                
                // 1. Initial Authentication Handler
                onAuthStateChanged(auth, async (user) => {
                    if (!user) {
                        try {
                            // Sign in using custom token or anonymously if token is missing/expired
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (error) {
                            console.error("Firebase Auth Error (Initial Sign In):", error);
                        }
                    }
                    // Update UI after successful sign-in or state change
                    updateAuthUI(user);
                });
            } else {
                console.warn("Firebase config not found. Auth features will be disabled.");
                // Fallback UI update for non-functional auth
                updateAuthUI(null); 
            }

            // --- UI/MODAL FUNCTIONS ---

            function showModal(id) {
                document.getElementById(id).style.display = 'flex';
            }

            function closeModal(id) {
                document.getElementById(id).style.display = 'none';
                // Clear any previous error messages
                const loginError = document.getElementById('login-error-message');
                if (loginError) loginError.classList.add('hidden');
                const registerError = document.getElementById('register-error-message');
                if (registerError) registerError.classList.add('hidden');
            }
            
            function showMessage(text) {
                document.getElementById('message-text').textContent = text;
                showModal('message-modal');
            }

            function showRegisterFromLogin() {
                closeModal('login-modal');
                showModal('register-modal');
            }
            
            // Expose to global scope for inline onclick events
            window.showModal = showModal;
            window.closeModal = closeModal;
            window.showRegisterFromLogin = showRegisterFromLogin;

            function updateAuthUI(user) {
                const authStatusDiv = document.getElementById('auth-status');
                authStatusDiv.innerHTML = ''; // Clear current status

                if (user && !user.isAnonymous) {
                    // Logged in (Email/Password or Google user)
                    // Truncate email for display simplicity
                    const displayEmail = user.email ? (user.email.length > 20 ? user.email.substring(0, 20) + '...' : user.email) : 'Người dùng Google';
                    
                    authStatusDiv.innerHTML = `
                        <div class="text-sm text-gray-300 flex items-center space-x-2">
                            <span class="text-green-400">●</span>
                            <span class="hidden sm:inline">Chào mừng,</span>
                            <span class="font-semibold text-white">${displayEmail}</span>
                            <span class="text-xs text-gray-500 hidden md:inline">| UID: ${user.uid.substring(0, 8)}...</span>
                        </div>
                        <button id="logout-button" class="py-1 px-3 bg-red-600 hover:bg-red-700 rounded-lg text-white text-sm font-medium transition duration-200">
                            Đăng Xuất
                        </button>
                    `;
                    document.getElementById('logout-button').onclick = handleLogout;
                } else {
                    // Logged out or Anonymous
                    authStatusDiv.innerHTML = `
                        <button onclick="showModal('login-modal')" class="py-1 px-3 bg-blue-600 hover:bg-blue-700 rounded-lg text-white text-sm font-medium transition duration-200">
                            Đăng Nhập
                        </button>
                        <button onclick="showModal('register-modal')" class="py-1 px-3 bg-green-600 hover:bg-green-700 rounded-lg text-white text-sm font-medium transition duration-200">
                            Đăng Ký
                        </button>
                    `;
                }
            }

            // --- AUTH HANDLERS ---
            
            document.getElementById('login-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const errorMessageElement = document.getElementById('login-error-message');
                errorMessageElement.classList.add('hidden');

                if (!auth) {
                    errorMessageElement.textContent = "Lỗi: Hệ thống Auth không khả dụng.";
                    errorMessageElement.classList.remove('hidden');
                    return;
                }

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    closeModal('login-modal');
                    showMessage("Đăng nhập thành công!");
                } catch (error) {
                    let message = "Đăng nhập thất bại. Vui lòng kiểm tra lại Email và Mật khẩu.";
                    if (error.code === 'auth/user-not-found') {
                        message = "Không tìm thấy người dùng với email này.";
                    } else if (error.code === 'auth/wrong-password') {
                        message = "Sai mật khẩu. Vui lòng thử lại.";
                    } else if (error.code === 'auth/invalid-email') {
                         message = "Email không hợp lệ.";
                    }
                    errorMessageElement.textContent = message;
                    errorMessageElement.classList.remove('hidden');
                    console.error("Login Error:", error);
                }
            });

            document.getElementById('register-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('register-email').value;
                const password = document.getElementById('register-password').value;
                const errorMessageElement = document.getElementById('register-error-message');
                errorMessageElement.classList.add('hidden');

                if (!auth) {
                    errorMessageElement.textContent = "Lỗi: Hệ thống Auth không khả dụng.";
                    errorMessageElement.classList.remove('hidden');
                    return;
                }

                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    
                    // Optional: Save user data to Firestore
                    const user = userCredential.user;
                    const userDocRef = doc(db, `/artifacts/${appId}/users/${user.uid}/profile/metadata`);
                    await setDoc(userDocRef, {
                        email: user.email,
                        createdAt: new Date().toISOString(),
                        loginMethod: 'email',
                        appId: appId
                    });

                    closeModal('register-modal');
                    showMessage("Đăng ký thành công! Bạn đã được đăng nhập.");

                } catch (error) {
                    let message = "Đăng ký thất bại. Vui lòng thử lại.";
                    if (error.code === 'auth/email-already-in-use') {
                        message = "Email này đã được sử dụng.";
                    } else if (error.code === 'auth/weak-password') {
                        message = "Mật khẩu quá yếu (phải có ít nhất 6 ký tự).";
                    } else if (error.code === 'auth/invalid-email') {
                        message = "Email không hợp lệ.";
                    }
                    errorMessageElement.textContent = message;
                    errorMessageElement.classList.remove('hidden');
                    console.error("Register Error:", error);
                }
            });

            // --- GOOGLE AUTH HANDLER ---

            async function handleGoogleAuth() {
                if (!auth) {
                    showMessage("Lỗi: Hệ thống Auth không khả dụng.");
                    return;
                }
                
                try {
                    // Dùng signInWithPopup để mở cửa sổ Google đăng nhập
                    const result = await signInWithPopup(auth, googleProvider);
                    const user = result.user;

                    // Kiểm tra và lưu thông tin vào Firestore nếu là người dùng mới
                    const userDocRef = doc(db, `/artifacts/${appId}/users/${user.uid}/profile/metadata`);
                    // Sử dụng setDoc với { merge: true } để không ghi đè nếu tài liệu đã tồn tại
                    await setDoc(userDocRef, {
                        email: user.email,
                        displayName: user.displayName,
                        photoURL: user.photoURL,
                        lastLoginAt: new Date().toISOString(),
                        loginMethod: 'google',
                        appId: appId
                    }, { merge: true });

                    closeModal('login-modal');
                    closeModal('register-modal');
                    showMessage("Đăng nhập bằng Google thành công!");

                } catch (error) {
                    let message = "Đăng nhập bằng Google thất bại.";
                    // Xử lý các lỗi phổ biến
                    if (error.code === 'auth/popup-closed-by-user') {
                        message = "Đã hủy đăng nhập. Vui lòng thử lại.";
                    } else if (error.code === 'auth/cancelled-popup-request') {
                         message = "Yêu cầu đăng nhập bị hủy do có popup khác đang chạy.";
                    } else {
                        message += " Vui lòng kiểm tra console để biết chi tiết.";

                } catch (error) {
                    showMessage("Lỗi khi đăng xuất. Vui lòng thử lại.");

            // --- Copy Functionality (Giữ nguyên) ---

                const codeElement = document.getElementById(elementId);
                const messageElement = document.getElementById(`message-${elementId.substring(5)}`);
                const code = codeElement.textContent;

                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = code;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextArea);

                button.textContent = 'Đã Copy!';
                button.disabled = true;
                messageElement.style.display = 'block';

                setTimeout(() => {
                    button.textContent = 'Copy';
                    button.disabled = false;
                    messageElement.style.display = 'hidden';
                }, 2000);
            }
