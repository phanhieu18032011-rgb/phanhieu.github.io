<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Link Generator - Tạo Link Raw</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea, input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            transition: border-color 0.3s;
        }

        textarea:focus, input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 25px rgba(108, 117, 125, 0.3);
        }

        .result-section {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .result-section.show {
            display: block;
        }

        .result-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .result-label {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .result-value {
            color: #333;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .copy-btn {
            background: #28a745;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .links-list {
            margin-top: 20px;
        }

        .link-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #667eea;
        }

        .link-info {
            flex: 1;
        }

        .link-url {
            color: #667eea;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            font-size: 13px;
        }

        .link-time {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .link-actions {
            display: flex;
            gap: 8px;
        }

        .link-actions button {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Raw Link Generator</h1>
        <p class="subtitle">Tạo link raw tự động với cấu trúc domain/apikey/v1/random</p>

        <div id="status" class="status"></div>

        <form id="linkForm">
            <div class="form-group">
                <label for="content">Nội dung (Content) *</label>
                <textarea id="content" name="content" placeholder="Nhập nội dung bạn muốn chia sẻ qua link raw..." required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="contentType">Loại nội dung (Content Type)</label>
                    <select id="contentType" name="contentType">
                        <option value="text/plain">Text Plain</option>
                        <option value="text/html">HTML</option>
                        <option value="application/json">JSON</option>
                        <option value="application/xml">XML</option>
                        <option value="text/css">CSS</option>
                        <option value="text/javascript">JavaScript</option>
                        <option value="text/markdown">Markdown</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="apiKey">API Key (tùy chọn)</label>
                    <input type="text" id="apiKey" name="apiKey" placeholder="Để trống để tạo tự động">
                </div>
            </div>

            <div class="button-group">
                <button type="submit">✨ Tạo Link</button>
                <button type="reset" class="btn-secondary">🔄 Xóa</button>
            </div>
        </form>

        <div id="resultSection" class="result-section">
            <h2 style="color: #333; margin-bottom: 20px;">📊 Kết quả</h2>

            <div class="result-item">
                <div class="result-label">API Key</div>
                <div class="result-value" id="resultApiKey">-</div>
                <button class="copy-btn" onclick="copyToClipboard('resultApiKey')">📋 Copy API Key</button>
            </div>

            <div class="result-item">
                <div class="result-label">Random Suffix</div>
                <div class="result-value" id="resultSuffix">-</div>
                <button class="copy-btn" onclick="copyToClipboard('resultSuffix')">📋 Copy Suffix</button>
            </div>

            <div class="result-item">
                <div class="result-label">📍 Raw Link (Chia sẻ cái này)</div>
                <div class="result-value" id="resultLink">-</div>
                <button class="copy-btn" onclick="copyToClipboard('resultLink')">📋 Copy Link</button>
                <button class="copy-btn" onclick="openRawLink()" style="background: #17a2b8; margin-top: 5px;">🌐 Mở Link</button>
            </div>

            <div class="result-item">
                <div class="result-label">📁 Đường dẫn File</div>
                <div class="result-value" id="resultPath">-</div>
                <button class="copy-btn" onclick="copyToClipboard('resultPath')">📋 Copy Path</button>
            </div>
        </div>

        <div id="linksSection" class="links-list" style="display: none; margin-top: 30px; padding-top: 30px; border-top: 2px solid #e0e0e0;">
            <h2 style="color: #333; margin-bottom: 20px;">📚 Danh sách Link</h2>
            <div id="linksList"></div>
        </div>
    </div>

    <script>
        let currentData = null;

        document.getElementById('linkForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const content = document.getElementById('content').value;
            const contentType = document.getElementById('contentType').value;

            if (!content.trim()) {
                showStatus('Vui lòng nhập nội dung', 'error');
                return;
            }

            showStatus('Đang tạo link...', 'loading');

            try {
                // Detect if running on Netlify or localhost
                const apiUrl = window.location.hostname.includes('netlify') 
                    ? '/.netlify/functions/create-link'
                    : '/api/create-link';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        content,
                        contentType
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    currentData = data;
                    displayResult(data);
                    showStatus('✓ Tạo link thành công!', 'success');
                    loadLinks(data.apiKey);
                } else {
                    showStatus('Lỗi: ' + data.error, 'error');
                }
            } catch (error) {
                showStatus('Lỗi: ' + error.message, 'error');
                console.error('Full error:', error);
            }
        });

        function displayResult(data) {
            document.getElementById('resultApiKey').textContent = data.apiKey;
            document.getElementById('resultSuffix').textContent = data.randomSuffix;
            document.getElementById('resultLink').textContent = data.link;
            document.getElementById('resultPath').textContent = data.filePath;

            document.getElementById('resultSection').classList.add('show');
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status show ${type}`;

            if (type !== 'loading') {
                setTimeout(() => {
                    statusEl.classList.remove('show');
                }, 5000);
            }
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;

            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Đã copy!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        function openRawLink() {
            if (currentData) {
                window.open(currentData.link, '_blank');
            }
        }

        async function loadLinks(apiKey) {
            try {
                const apiUrl = window.location.hostname.includes('netlify')
                    ? `/.netlify/functions/links/${apiKey}`
                    : `/api/links/${apiKey}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.success && data.links.length > 0) {
                    const listEl = document.getElementById('linksList');
                    listEl.innerHTML = data.links.map(link => `
                        <div class="link-item">
                            <div class="link-info">
                                <div class="link-url">${link.link}</div>
                                <div class="link-time">📅 ${new Date(link.timestamp).toLocaleString('vi-VN')}</div>
                                <div class="link-time">📊 ${link.contentType} (${link.size} bytes)</div>
                            </div>
                            <div class="link-actions">
                                <button onclick="copyLink('${link.link}')" style="background: #28a745;">Copy</button>
                                <button onclick="window.open('${link.link}', '_blank')" style="background: #17a2b8;">Open</button>
                            </div>
                        </div>
                    `).join('');

                    document.getElementById('linksSection').style.display = 'block';
                }
            } catch (error) {
                console.error('Lỗi khi tải danh sách link:', error);
            }
        }

        function copyLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                showStatus('✓ Đã copy link!', 'success');
            });
        }
    </script>
</body>
</html>
